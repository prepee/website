<script>
const wheel = document.getElementById('wheelMenu');
const totalItems = 6; 
const anglePerStep = 360 / totalItems;
let currentRotation = 0;

window.addEventListener('wheel', (event) => {
  // Prevent regular page scrolling while using the menu
  event.preventDefault(); 

  if (event.deltaY > 0) {
    // Scrolling down moves the wheel up
    currentRotation -= anglePerStep;
  } else {
    // Scrolling up moves the wheel down
    currentRotation += anglePerStep;
  }

  // Rotate the entire wheel structure
  wheel.style.transform = `rotate(${currentRotation}deg)`;

  // Correct the icon angles instantly so they never look tilted
  const items = document.querySelectorAll('.wheel-item img');
  items.forEach((img, index) => {
    const baseAngle = -anglePerStep * index;
    img.style.transform = `rotate(${-currentRotation + baseAngle}deg)`;
  });
}, { passive: false });
</script>
